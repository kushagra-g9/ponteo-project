# =============================================================================
# Ponteo Project — 6-Stage PR Pipeline
# Trigger: Developer opens/updates Pull Request on GitHub
#
# Stage 1: SonarQube Scan (quality gate)          PASS -> continue | FAIL -> stop
# Stage 2: AI Code Review (AWS Bedrock)           PASS -> continue | FAIL -> stop
# Stage 3: Test Cases Run (AI-assisted)           PASS -> continue | FAIL -> stop
# Stage 4: Docker Build + ECR Push + Trivy Scan   PASS -> continue | FAIL -> stop
# Stage 5: Manual Approval Gate                   Approved -> continue | Rejected -> stop
# Stage 6: Update image tag on argo-manifest branch (manifest-only; no Argo/EKS required)
#
# Stage 4 flow: build image -> push to ECR -> Trivy scan (HIGH/CRITICAL blocks)
# =============================================================================
name: PR Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, staging, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: pr-pipeline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write
  security-events: write
  actions: read

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'
  TRIVY_VERSION: 'v0.72.0'
  TRIVY_BLOCK_CLASS: ${{ vars.TRIVY_BLOCK_CLASS || 'lang-pkgs' }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID || 'us.anthropic.claude-sonnet-4-5-20250929-v1:0' }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  SERVICE_NAME: ${{ vars.SERVICE_NAME || 'ponteo-project' }}
  GITOPS_REPO: ${{ vars.GITOPS_REPO }}
  MANIFEST_BRANCH: ${{ vars.MANIFEST_BRANCH || 'argo-manifest' }}
  MANIFEST_PATH: ${{ vars.GITOPS_MANIFEST_PATH || 'argo-manifest/deployment.yaml' }}
  DOCKERFILE_PATH: ${{ vars.DOCKERFILE_PATH || 'Dockerfile' }}
  SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
  BEDROCK_MAX_OUTPUT_TOKENS: ${{ vars.BEDROCK_MAX_OUTPUT_TOKENS || '1024' }}
  BEDROCK_MAX_DIFF_CHARS: ${{ vars.BEDROCK_MAX_DIFF_CHARS || '8000' }}
  BEDROCK_MAX_PR_BODY_CHARS: ${{ vars.BEDROCK_MAX_PR_BODY_CHARS || '300' }}
  BEDROCK_MAX_TEST_LOG_CHARS: ${{ vars.BEDROCK_MAX_TEST_LOG_CHARS || '2000' }}
  BEDROCK_TEST_MAX_OUTPUT_TOKENS: ${{ vars.BEDROCK_TEST_MAX_OUTPUT_TOKENS || '512' }}
  BEDROCK_COST_MODE: ${{ vars.BEDROCK_COST_MODE || 'smart' }}
  BEDROCK_SKIP_TEST_AI_ON_PASS: ${{ vars.BEDROCK_SKIP_TEST_AI_ON_PASS || 'false' }}

jobs:
  stage-1-sonarqube:
    name: 'Stage 1 - SonarQube Scan'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js with caching
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run unit tests with coverage
        run: npm run test:coverage --if-present || npm test -- --coverage --ci
        env:
          CI: true
          NODE_ENV: test

      - name: Run SonarQube scan and quality gate
        uses: ./.github/actions/sonarqube-scan
        with:
          sonar-host-url: ${{ secrets.SONAR_HOST_URL }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
          sonar-organization: ${{ env.SONAR_ORGANIZATION }}
          pull-request-key: ${{ github.event.pull_request.number }}
          pull-request-branch: ${{ github.head_ref }}
          pull-request-base: ${{ github.base_ref }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Sonar report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonar-report
          path: .scannerwork/report-task.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage/
            lcov.info
          retention-days: 7
          if-no-files-found: warn

      - name: Stage 1 failure summary
        if: failure()
        run: |
          python3 scripts/pipeline_fail.py \
            --stage "Stage 1" \
            --reason "SonarQube scan or quality gate did not pass." \
            --hint "Open SonarCloud and review the Quality Gate for this PR." \
            --hint "Check unit test coverage and code smells reported by SonarQube." \
            --hint "Dashboard: ${{ secrets.SONAR_HOST_URL }}/dashboard?id=${{ vars.SONAR_PROJECT_KEY }}"
          exit 1

  stage-2-ai-review:
    name: 'Stage 2 - AI Code Review'
    runs-on: ubuntu-latest
    needs: stage-1-sonarqube
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Sonar report
        uses: actions/download-artifact@v4
        with:
          name: sonar-report
          path: scan-artifacts
        continue-on-error: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-bedrock-review-${{ github.run_id }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run Bedrock AI code review (blocking)
        uses: ./.github/actions/bedrock-review
        with:
          model-id: ${{ env.BEDROCK_MODEL_ID }}
          aws-region: ${{ env.AWS_REGION }}
          pr-number: ${{ github.event.pull_request.number }}
          pr-title: ${{ github.event.pull_request.title }}
          pr-body: ${{ github.event.pull_request.body }}
          base-ref: ${{ github.base_ref }}
          head-ref: ${{ github.head_ref }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          blocking: 'true'

      - name: Upload AI review artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-review-report
          path: artifacts/ai-review.md
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish AI review as PR comment
        if: always() && hashFiles('artifacts/ai-review.md') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/github_comment.py \
            --pr-number "${{ github.event.pull_request.number }}" \
            --report-path artifacts/ai-review.md \
            --repository "${{ github.repository }}" \
            --marker "<!-- ponteo-ai-review-bot -->"

      - name: Stage 2 failure summary
        if: failure()
        run: |
          if [ ! -f artifacts/ai-review-verdict.txt ]; then
            python3 scripts/pipeline_fail.py \
              --stage "Stage 2" \
              --reason "AI review setup or Bedrock call failed before a verdict was written." \
              --hint "Expand 'Run Bedrock AI code review' — exit 141 means git diff truncation bug (now fixed)." \
              --hint "Verify Bedrock model ID and IAM bedrock:InvokeModel permissions."
          else
            python3 scripts/pipeline_fail.py \
              --stage "Stage 2" \
              --reason "AI code review returned a blocking verdict or enforcement failed." \
              --details-file artifacts/ai-review.md \
              --hint "Review the PR comment or ai-review-report artifact."
          fi
          exit 1

  stage-3-ai-tests:
    name: 'Stage 3 - AI-Assisted Tests'
    runs-on: ubuntu-latest
    needs: stage-2-ai-review
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js with caching
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run test suite
        id: run-tests
        continue-on-error: true
        run: |
          npm run test:ci --if-present > test-output.log 2>&1 || npm test -- --ci >> test-output.log 2>&1
          EXIT_CODE=$?
          echo "exit-code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          cat test-output.log
          exit 0
        env:
          CI: true
          NODE_ENV: test

      - name: Configure AWS credentials (OIDC)
        if: steps.run-tests.outputs.exit-code != '0' || env.BEDROCK_COST_MODE != 'economy'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-bedrock-tests-${{ github.run_id }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: AI-assisted test validation (blocking)
        env:
          BEDROCK_MODEL_ID: ${{ env.BEDROCK_MODEL_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
          TEST_EXIT_CODE: ${{ steps.run-tests.outputs.exit-code }}
          TEST_OUTPUT_PATH: test-output.log
          CONTEXT_DIR: context
          OUTPUT_PATH: artifacts/test-validation.md
          PROMPTS_DIR: prompts
          BEDROCK_SKIP_TEST_AI_ON_PASS: ${{ env.BEDROCK_SKIP_TEST_AI_ON_PASS }}
          BEDROCK_COST_MODE: ${{ env.BEDROCK_COST_MODE }}
          BEDROCK_MAX_TEST_LOG_CHARS: ${{ env.BEDROCK_MAX_TEST_LOG_CHARS }}
          BEDROCK_TEST_MAX_OUTPUT_TOKENS: ${{ env.BEDROCK_TEST_MAX_OUTPUT_TOKENS }}
          BEDROCK_MAX_DIFF_CHARS: ${{ env.BEDROCK_MAX_DIFF_CHARS }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p context artifacts
          git fetch origin "${BASE_REF}" --depth=1
          git diff --name-only "origin/${BASE_REF}...HEAD" > context/changed-files.txt
          if [ -s context/changed-files.txt ]; then
            git diff "origin/${BASE_REF}...HEAD" -- $(cat context/changed-files.txt) > context/git-diff.full
            head -c "${{ env.BEDROCK_MAX_DIFF_CHARS }}" context/git-diff.full > context/git-diff.patch
            rm -f context/git-diff.full
          else
            : > context/git-diff.patch
          fi
          python3 scripts/test_validation.py

      - name: Publish test validation as PR comment
        if: always() && hashFiles('artifacts/test-validation.md') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/github_comment.py \
            --pr-number "${{ github.event.pull_request.number }}" \
            --report-path artifacts/test-validation.md \
            --repository "${{ github.repository }}" \
            --marker "<!-- ponteo-test-validation-bot -->"

      - name: Upload test validation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-validation-report
          path: |
            artifacts/test-validation.md
            test-output.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail if tests or AI validation failed
        run: |
          if [ "${{ steps.run-tests.outputs.exit-code }}" != "0" ]; then
            python3 scripts/pipeline_fail.py \
              --stage "Stage 3" \
              --reason "Unit/integration tests failed (non-zero exit code)." \
              --details-file test-output.log \
              --hint "Run npm test locally and fix failing tests."
            exit 1
          fi
          if [ ! -f artifacts/test-validation-verdict.txt ]; then
            python3 scripts/pipeline_fail.py \
              --stage "Stage 3" \
              --reason "AI test validation did not produce a verdict file." \
              --hint "Check scripts/test_validation.py and preceding test logs."
            exit 1
          fi
          VERDICT=$(tr -d '[:space:]' < artifacts/test-validation-verdict.txt)
          if [ "$VERDICT" != "PASS" ]; then
            python3 scripts/pipeline_fail.py \
              --stage "Stage 3" \
              --reason "AI test validation verdict was ${VERDICT} (required: PASS)." \
              --details-file artifacts/test-validation.md \
              --hint "Review test failures or AI validation notes in the report."
            exit 1
          fi
          echo "Stage 3 PASSED: tests and AI validation succeeded."

  stage-4-docker-ecr:
    name: 'Stage 4 - Docker Build + ECR + Trivy'
    runs-on: ubuntu-latest
    needs: stage-3-ai-tests
    timeout-minutes: 45
    outputs:
      image-uri: ${{ steps.build.outputs.image-uri }}
      image-tag: ${{ steps.tag.outputs.image-tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "image-tag=pr-${{ github.event.pull_request.number }}-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-ecr-${{ github.run_id }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, push to ECR, then Trivy scan
        id: build
        uses: ./.github/actions/docker-build-push
        with:
          ecr-registry: ${{ env.ECR_REGISTRY }}
          ecr-repository: ${{ env.ECR_REPOSITORY }}
          image-tag: ${{ steps.tag.outputs.image-tag }}
          dockerfile: ${{ env.DOCKERFILE_PATH }}
          trivy-version: ${{ env.TRIVY_VERSION }}
          severity: 'HIGH,CRITICAL'
          trivy-block-class: ${{ env.TRIVY_BLOCK_CLASS }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload Trivy image scan report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-report
          path: trivy-image-results.json
          retention-days: 14
          if-no-files-found: ignore

  stage-5-approval:
    name: 'Stage 5 - Manual Approval'
    runs-on: ubuntu-latest
    needs: stage-4-docker-ecr
    environment:
      name: ${{ github.base_ref == 'main' && 'production' || 'staging' }}
    timeout-minutes: 1440
    steps:
      - name: Record approval
        run: |
          echo "Deployment approved by: ${{ github.actor }}"
          echo "Environment: ${{ github.base_ref == 'main' && 'production' || 'staging' }}"
          echo "Image: ${{ needs.stage-4-docker-ecr.outputs.image-uri }}"

  stage-6-update-image-tag:
    name: 'Stage 6 - Update Image Tag'
    runs-on: ubuntu-latest
    needs: [stage-4-docker-ecr, stage-5-approval]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tag on manifest branch
        if: env.GITOPS_REPO == ''
        env:
          IMAGE_URI: ${{ needs.stage-4-docker-ecr.outputs.image-uri }}
          IMAGE_TAG: ${{ needs.stage-4-docker-ecr.outputs.image-tag }}
          MANIFEST: ${{ env.MANIFEST_PATH }}
          MANIFEST_BRANCH: ${{ env.MANIFEST_BRANCH }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git ls-remote --heads origin "${MANIFEST_BRANCH}" | grep -q .; then
            echo "Manifest branch '${MANIFEST_BRANCH}' not found."
            echo "Create it once with only the argo-manifest/ folder, then re-run Stage 6."
            exit 1
          fi

          git checkout "${MANIFEST_BRANCH}"

          if [ ! -f "$MANIFEST" ]; then
            echo "Manifest not found: $MANIFEST"
            exit 1
          fi

          if command -v yq >/dev/null 2>&1; then
            yq -i ".spec.template.spec.containers[0].image = \"${IMAGE_URI}\"" "$MANIFEST"
          else
            sed -i "s|image:.*${{ env.ECR_REPOSITORY }}.*|image: ${IMAGE_URI}|g" "$MANIFEST"
          fi

          git add "$MANIFEST"

          if git diff --cached --quiet; then
            echo "Image tag already up to date."
            exit 0
          fi

          git commit -m "ci(pr-${{ github.event.pull_request.number }}): update image tag ${IMAGE_TAG}

          PR: ${{ github.repository }}#${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
          Approved by: ${{ github.actor }}
          Updated: ${MANIFEST} (image field only)"

          git push origin "${MANIFEST_BRANCH}"

      - name: Stage 6 failure summary
        if: failure() && env.GITOPS_REPO == ''
        run: |
          python3 scripts/pipeline_fail.py \
            --stage "Stage 6" \
            --reason "Failed to update the image tag on the manifest branch." \
            --hint "Ensure branch '${{ env.MANIFEST_BRANCH }}' exists with ${{ env.MANIFEST_PATH }}." \
            --hint "Verify GITHUB_TOKEN contents:write permission on this job." \
            --hint "Confirm Stage 5 manual approval completed successfully."
          exit 1

      - name: Checkout external GitOps repository (optional)
        if: env.GITOPS_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Update image tag in external GitOps repo (optional)
        if: env.GITOPS_REPO != ''
        working-directory: gitops
        env:
          IMAGE_URI: ${{ needs.stage-4-docker-ecr.outputs.image-uri }}
          IMAGE_TAG: ${{ needs.stage-4-docker-ecr.outputs.image-tag }}
          MANIFEST: ${{ env.MANIFEST_PATH }}
        run: |
          set -euo pipefail

          if [ ! -f "$MANIFEST" ]; then
            echo "Manifest not found: $MANIFEST"
            exit 1
          fi

          if command -v yq >/dev/null 2>&1; then
            yq -i ".spec.template.spec.containers[0].image = \"${IMAGE_URI}\"" "$MANIFEST"
          else
            sed -i "s|image:.*${{ env.ECR_REPOSITORY }}.*|image: ${IMAGE_URI}|g" "$MANIFEST"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST"

          if git diff --cached --quiet; then
            echo "Image tag already up to date."
            exit 0
          fi

          git commit -m "ci(pr-${{ github.event.pull_request.number }}): update image tag ${IMAGE_TAG}"

      - name: Push external GitOps changes (optional)
        if: env.GITOPS_REPO != ''
        working-directory: gitops
        run: git push origin HEAD

      - name: Pipeline summary
        run: |
          {
            echo "## PR Pipeline Complete"
            echo ""
            echo "| Stage | Result |"
            echo "|-------|--------|"
            echo "| 1 - SonarQube | PASS |"
            echo "| 2 - AI Code Review | PASS |"
            echo "| 3 - AI-Assisted Tests | PASS |"
            echo "| 4 - Docker + ECR + Trivy | PASS |"
            echo "| 5 - Manual Approval | APPROVED |"
            echo "| 6 - Update Image Tag | UPDATED |"
            echo ""
            echo "**PR:** #${{ github.event.pull_request.number }}"
            echo "**Image:** \`${{ needs.stage-4-docker-ecr.outputs.image-uri }}\`"
            echo "**Manifest:** \`${{ env.MANIFEST_PATH }}\` on branch \`${{ env.MANIFEST_BRANCH }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
