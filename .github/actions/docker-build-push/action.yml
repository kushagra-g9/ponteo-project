name: Docker Build Push
description: Build Docker image, push to ECR, Trivy vulnerability scan

inputs:
  ecr-registry:
    description: ECR registry URL
    required: true
  ecr-repository:
    description: ECR repository name
    required: true
  image-tag:
    description: Image tag
    required: true
  dockerfile:
    description: Dockerfile path
    required: false
    default: Dockerfile
  trivy-version:
    description: Trivy version
    required: false
    default: 'v0.72.0'
  severity:
    description: Severity threshold
    required: false
    default: 'HIGH,CRITICAL'
  trivy-block-class:
    description: Trivy result class that blocks the pipeline (lang-pkgs or os-pkgs)
    required: false
    default: 'lang-pkgs'
  aws-region:
    description: AWS region
    required: true

outputs:
  image-uri:
    description: Full image URI
    value: ${{ steps.meta.outputs.image-uri }}

runs:
  using: composite
  steps:
    - name: Compute image metadata
      id: meta
      shell: bash
      run: |
        IMAGE_URI="${{ inputs.ecr-registry }}/${{ inputs.ecr-repository }}:${{ inputs.image-tag }}"
        echo "image-uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
        echo "image=${IMAGE_URI}" >> "$GITHUB_ENV"

    - name: Build and push Docker image to ECR
      id: docker-build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        push: true
        tags: |
          ${{ steps.meta.outputs.image-uri }}
          ${{ inputs.ecr-registry }}/${{ inputs.ecr-repository }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILD_DATE=${{ github.event.repository.updated_at }}
          VCS_REF=${{ github.sha }}
          VERSION=${{ inputs.image-tag }}

    - name: Cache Trivy DB
      uses: actions/cache@v4
      with:
        path: ~/.cache/trivy
        key: trivy-db-${{ inputs.trivy-version }}-${{ runner.os }}
        restore-keys: |
          trivy-db-${{ inputs.trivy-version }}-

    - name: Trivy image vulnerability scan (post-ECR push)
      id: trivy-scan
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        version: ${{ inputs.trivy-version }}
        image-ref: ${{ steps.meta.outputs.image-uri }}
        format: json
        output: trivy-image-results.json
        severity: ${{ inputs.severity }}
        scanners: vuln
        ignore-unfixed: true
        exit-code: '0'

    - name: Trivy human-readable report
      if: always()
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        version: ${{ inputs.trivy-version }}
        image-ref: ${{ steps.meta.outputs.image-uri }}
        format: table
        severity: ${{ inputs.severity }}
        scanners: vuln
        ignore-unfixed: true
        exit-code: '0'

    - name: Trivy blocking gate and failure report
      shell: bash
      run: |
        python3 scripts/trivy_gate.py \
          --report trivy-image-results.json \
          --severities "${{ inputs.severity }}" \
          --image "${{ steps.meta.outputs.image-uri }}" \
          --stage "Stage 4" \
          --block-class "${{ inputs.trivy-block-class }}"

    - name: Stage 4 failure summary (build/push)
      if: failure() && steps.docker-build.outcome == 'failure'
      shell: bash
      run: |
        python3 scripts/pipeline_fail.py \
          --stage "Stage 4" \
          --reason "Docker build or ECR push failed before Trivy scan." \
          --hint "Check Dockerfile syntax and AWS ECR permissions (OIDC role)." \
          --hint "Verify GitHub variables ECR_REGISTRY and ECR_REPOSITORY."

    - name: Stage 4 failure summary (Trivy gate)
      if: failure() && steps.docker-build.outcome == 'success'
      shell: bash
      run: |
        python3 scripts/pipeline_fail.py \
          --stage "Stage 4" \
          --reason "Trivy gate failed — blocking HIGH/CRITICAL vulnerabilities found." \
          --hint "Expand the 'Trivy blocking gate and failure report' step for the CVE list." \
          --hint "Download artifact trivy-image-report for full JSON." \
          --hint "Application CVEs: npm audit / dependency updates. OS CVEs: update base image digest."
        exit 1

    - name: Trivy scan summary
      if: always()
      shell: bash
      run: |
        {
          echo "## Trivy Image Scan (post-ECR push)"
          echo ""
          echo "| Field | Value |"
          echo "|-------|-------|"
          echo "| Image | \`${{ steps.meta.outputs.image-uri }}\` |"
          echo "| Severity threshold | \`${{ inputs.severity }}\` |"
          echo "| Blocking class | \`${{ inputs.trivy-block-class }}\` |"
          echo "| Scanners | vuln |"
        } >> "$GITHUB_STEP_SUMMARY"
