name: Docker Build Push
description: Build Docker image, Trivy scan, push to ECR only if scan passes

inputs:
  ecr-registry:
    description: ECR registry URL
    required: true
  ecr-repository:
    description: ECR repository name
    required: true
  image-tag:
    description: Image tag
    required: true
  dockerfile:
    description: Dockerfile path
    required: false
    default: Dockerfile
  trivy-version:
    description: Trivy version
    required: false
    default: 'v0.72.0'
  severity:
    description: Severity threshold
    required: false
    default: 'HIGH,CRITICAL'
  trivy-block-class:
    description: Trivy result class that blocks the pipeline (lang-pkgs or os-pkgs)
    required: false
    default: 'lang-pkgs'
  aws-region:
    description: AWS region
    required: true

outputs:
  image-uri:
    description: Full image URI
    value: ${{ steps.meta.outputs.image-uri }}

runs:
  using: composite
  steps:
    - name: Compute image metadata
      id: meta
      shell: bash
      run: |
        IMAGE_URI="${{ inputs.ecr-registry }}/${{ inputs.ecr-repository }}:${{ inputs.image-tag }}"
        LATEST_URI="${{ inputs.ecr-registry }}/${{ inputs.ecr-repository }}:latest"
        echo "image-uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
        echo "latest-uri=${LATEST_URI}" >> "$GITHUB_OUTPUT"
        echo "image=${IMAGE_URI}" >> "$GITHUB_ENV"

    - name: Build Docker image locally (no push)
      id: docker-build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        push: false
        load: true
        tags: |
          ${{ steps.meta.outputs.image-uri }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILD_DATE=${{ github.event.repository.updated_at }}
          VCS_REF=${{ github.sha }}
          VERSION=${{ inputs.image-tag }}

    - name: Cache Trivy DB
      uses: actions/cache@v4
      with:
        path: ~/.cache/trivy
        key: trivy-db-${{ inputs.trivy-version }}-${{ runner.os }}
        restore-keys: |
          trivy-db-${{ inputs.trivy-version }}-

    - name: Trivy image vulnerability scan (pre-push gate)
      id: trivy-scan
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        version: ${{ inputs.trivy-version }}
        image-ref: ${{ steps.meta.outputs.image-uri }}
        format: json
        output: trivy-image-results.json
        severity: ${{ inputs.severity }}
        scanners: vuln
        ignore-unfixed: true
        exit-code: '0'

    - name: Trivy human-readable report
      if: always()
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        version: ${{ inputs.trivy-version }}
        image-ref: ${{ steps.meta.outputs.image-uri }}
        format: table
        severity: ${{ inputs.severity }}
        scanners: vuln
        ignore-unfixed: true
        exit-code: '0'

    - name: Trivy blocking gate and failure report
      id: trivy-gate
      shell: bash
      run: |
        python3 scripts/trivy_gate.py \
          --report trivy-image-results.json \
          --severities "${{ inputs.severity }}" \
          --image "${{ steps.meta.outputs.image-uri }}" \
          --stage "Stage 4" \
          --block-class "${{ inputs.trivy-block-class }}"

    - name: Push scanned image to ECR
      id: docker-push
      shell: bash
      run: |
        set -euo pipefail
        IMAGE_URI="${{ steps.meta.outputs.image-uri }}"
        LATEST_URI="${{ steps.meta.outputs.latest-uri }}"
        docker tag "${IMAGE_URI}" "${LATEST_URI}"
        docker push "${IMAGE_URI}"
        docker push "${LATEST_URI}"
        echo "Pushed ${IMAGE_URI} after Trivy gate passed."

    - name: Stage 4 failure summary (build)
      if: failure() && steps.docker-build.outcome == 'failure'
      shell: bash
      run: |
        python3 scripts/pipeline_fail.py \
          --stage "Stage 4" \
          --reason "Docker build failed before Trivy scan and ECR push." \
          --hint "Check Dockerfile syntax and build logs."

    - name: Stage 4 failure summary (Trivy gate)
      if: failure() && steps.docker-build.outcome == 'success' && steps.trivy-gate.outcome == 'failure'
      shell: bash
      run: |
        python3 scripts/pipeline_fail.py \
          --stage "Stage 4" \
          --reason "Trivy gate failed — image was NOT pushed to ECR." \
          --hint "Expand the 'Trivy blocking gate and failure report' step for the CVE list." \
          --hint "Download artifact trivy-image-report for full JSON." \
          --hint "Application CVEs: npm audit / dependency updates. OS CVEs: update base image digest."
        exit 1

    - name: Stage 4 failure summary (ECR push)
      if: failure() && steps.trivy-gate.outcome == 'success' && steps.docker-push.outcome == 'failure'
      shell: bash
      run: |
        python3 scripts/pipeline_fail.py \
          --stage "Stage 4" \
          --reason "Trivy passed but ECR push failed." \
          --hint "Verify AWS ECR permissions on the OIDC role." \
          --hint "Confirm ECR_REGISTRY and ECR_REPOSITORY variables."

    - name: Trivy scan summary
      if: always()
      shell: bash
      run: |
        {
          echo "## Trivy Image Scan (pre-push gate)"
          echo ""
          echo "| Field | Value |"
          echo "|-------|-------|"
          echo "| Image | \`${{ steps.meta.outputs.image-uri }}\` |"
          echo "| Order | build → Trivy → push to ECR |"
          echo "| Severity threshold | \`${{ inputs.severity }}\` |"
          echo "| Blocking class | \`${{ inputs.trivy-block-class }}\` |"
          echo "| Scanners | vuln |"
        } >> "$GITHUB_STEP_SUMMARY"
