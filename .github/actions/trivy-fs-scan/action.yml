name: Trivy Filesystem Scan
description: Scan filesystem, dependencies, secrets, Dockerfile, K8s, and Terraform

inputs:
  trivy-version:
    description: Trivy version
    required: false
    default: 'v0.72.0'
  severity:
    description: Comma-separated severity levels to fail on
    required: false
    default: 'HIGH,CRITICAL'
  scan-paths:
    description: Paths to scan
    required: false
    default: '.'
  fail-on-findings:
    description: Fail workflow on findings
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Cache Trivy DB
      uses: actions/cache@v4
      with:
        path: ~/.cache/trivy
        key: trivy-db-${{ inputs.trivy-version }}-${{ runner.os }}
        restore-keys: |
          trivy-db-${{ inputs.trivy-version }}-

    - name: Trivy filesystem vulnerability scan
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        version: ${{ inputs.trivy-version }}
        scan-type: fs
        scan-ref: ${{ inputs.scan-paths }}
        format: json
        output: trivy-fs-results.json
        severity: ${{ inputs.severity }}
        scanners: vuln,secret,misconfig
        ignore-unfixed: true
        exit-code: ${{ inputs.fail-on-findings == 'true' && '1' || '0' }}
